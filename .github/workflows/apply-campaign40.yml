name: Apply verified 40-stage campaign
on:
  push:
    branches: [main]
    paths: ['.ci/campaign40-*.bin']
permissions:
  contents: write
  actions: write
concurrency:
  group: apply-campaign40
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify and materialize reviewed source and original plan
        run: python .ci/apply_campaign40.py
      - name: Run complete logic and campaign regression suite
        run: npm test
      - name: Commit source atomically and run normal cross-browser deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          m=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'campaign40-manifest.json').read_text())
          head=git('ls-remote','origin','refs/heads/main').split()[0]
          assert head==os.environ['GITHUB_SHA'], 'main changed concurrently; refusing to overwrite'
          # Remove transport files and restore the exact normal deployment workflow.
          original=subprocess.check_output(['git','show',m['base']+':.github/workflows/deploy-pages.yml'])
          pathlib.Path('.github/workflows/deploy-pages.yml').write_bytes(original)
          remove=['.ci/apply_campaign40.py','.github/workflows/apply-campaign40.yml']+[f'.ci/campaign40-{i}.bin' for i in range(1,7)]
          for name in remove: pathlib.Path(name).unlink()
          subprocess.run(['git','add','--']+[f['path'] for f in m['files']]+remove+['.github/workflows/deploy-pages.yml'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat: ship 40-room campaign with original plan, ID migration and browser verification'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          sha=git('rev-parse','HEAD')
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/deploy-pages.yml/dispatches"
          req=urllib.request.Request(url,data=json.dumps({'ref':'main'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              assert r.status==204, 'Deployment workflow dispatch failed'
          print('40-room source committed and normal deployment checks dispatched:',sha)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## 40-room source applied\nCommit: '+sha+'\nOriginal plan preserved. Normal browser tests and Pages deployment dispatched.\n')
          PY
