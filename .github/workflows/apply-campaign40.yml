name: Apply verified 40-stage campaign
on:
  push:
    branches: [main]
    paths: ['.ci/**', '.github/workflows/apply-campaign40.yml']
permissions:
  contents: write
concurrency:
  group: apply-campaign40
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify and materialize reviewed source and original plan
        run: python .ci/apply_campaign40.py
      - name: Run complete logic and campaign regression suite
        run: npm test
      - name: Commit source without changing workflow files
        run: |
          python <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          m=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'campaign40-manifest.json').read_text())
          head=git('ls-remote','origin','refs/heads/main').split()[0]
          assert head==os.environ['GITHUB_SHA'], 'main changed concurrently; refusing to overwrite'
          # Workflow cleanup is performed separately by the authorized GitHub connector.
          remove=['.ci/apply_campaign40.py']+[f'.ci/campaign40-{i}.bin' for i in range(1,7)]
          for name in remove: pathlib.Path(name).unlink()
          subprocess.run(['git','add','--']+[f['path'] for f in m['files']]+remove,check=True)
          assert not any(p.startswith('.github/workflows/') for p in git('diff','--cached','--name-only').splitlines())
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat: ship 40-room campaign with original plan, ID migration and browser verification'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          sha=git('rev-parse','HEAD')
          print('40-room source and original plan committed:',sha)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## 40-room source applied\nCommit: '+sha+'\n137 checks passed. Workflow cleanup and normal Pages dispatch follow through the authorized connector.\n')
          PY
