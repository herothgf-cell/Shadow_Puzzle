name: Test and deploy Shadow Puzzle
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadow-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Web checks (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build and verify game logic
        run: npm test
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Test the served mobile and PC build
        run: python tests/hosting_browser.py --engine ${{ matrix.engine }}
      - name: Original V7 browser regression suite
        if: matrix.engine == 'chromium'
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.engine }}
          path: qa/
          if-no-files-found: ignore
          retention-days: 14
  build:
    name: Package verified site
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-ready
  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
  live:
    name: Verify published mobile and PC URL
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Wait for the exact deployed commit
        shell: bash
        run: |
          python <<'PY'
          import json, os, time, urllib.request
          url = os.environ['LIVE_URL'].rstrip('/') + '/version.json?commit=' + os.environ['EXPECTED_SHA']
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      data = json.load(response)
                  if data.get('commit') == os.environ['EXPECTED_SHA']:
                      print('Published commit verified:', data)
                      break
              except Exception as error:
                  print('Waiting for Pages:', str(error))
              time.sleep(5)
          else:
              raise SystemExit('Pages did not serve the expected commit in time')
          PY
      - name: Install live browser checks
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Play through the actual HTTPS site
        run: python tests/hosting_browser.py --engine chromium --base-url "$LIVE_URL" --smoke
      - name: Publish verification summary
        run: |
          echo "## Shadow Puzzle is live" >> "$GITHUB_STEP_SUMMARY"
          echo "$LIVE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified deployed commit: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-published-site
          path: qa/
          if-no-files-found: ignore
          retention-days: 14
