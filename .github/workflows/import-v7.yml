name: Import verified V7 sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-v7.yml']
permissions:
  contents: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify source payload and unpack only approved text files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const crypto = require('node:crypto');
          const encoded = [1,2,3,4].map(i => fs.readFileSync(`.bootstrap/source-${i}.b64`, 'utf8').trim()).join('');
          const data = zlib.brotliDecompressSync(Buffer.from(encoded, 'base64'));
          const expected = 'bf6b808c0468b8d3be2123c96ea927da048fa82f4cbc0bd89728407b4b9f6907';
          if (data.length !== 214252 || crypto.createHash('sha256').update(data).digest('hex') !== expected) throw new Error('Source checksum mismatch');
          const files = JSON.parse(data.toString('utf8'));
          const entries = Object.entries(files);
          if (entries.length !== 25) throw new Error('Unexpected file count');
          const rootFiles = new Set(['package.json','build.cjs','requirements-dev.txt','.gitignore']);
          for (const [name, content] of entries) {
            if (typeof content !== 'string' || name.includes('..') || name.includes('\\') || path.isAbsolute(name) || (!/^(src|tests|docs)\//.test(name) && !rootFiles.has(name))) throw new Error(`Disallowed source path: ${name}`);
            if (fs.existsSync(name) && fs.readFileSync(name, 'utf8') !== content) throw new Error(`Refusing to overwrite concurrent edits: ${name}`);
          }
          for (const [name, content] of entries) {
            fs.mkdirSync(path.dirname(name), {recursive:true});
            fs.writeFileSync(name, content, 'utf8');
          }
          console.log(`Verified and imported ${entries.length} text source files (${data.length} bytes).`);
          NODE
      - name: Verify source and all core tests
        run: npm test
      - name: Commit tested sources to requested main branch
        shell: bash
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs package.json build.cjs requirements-dev.txt .gitignore
          git rm .bootstrap/source-1.b64 .bootstrap/source-2.b64 .bootstrap/source-3.b64 .bootstrap/source-4.b64
          git commit -m 'feat: import Shadow Morph V7 with mobile and PC web validation'
          git push origin HEAD:main
          echo 'Imported verified V7 sources and removed the temporary transfer payload.' >> "$GITHUB_STEP_SUMMARY"
